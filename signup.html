<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
    <title>Sign Up — Expense Tracker</title>
  </head>
  <body>
    <div class="auth_wrapper">
      <div class="auth_card">
        <h1 class="auth_title">Expense<span>Tracker</span></h1>
        <p class="auth_subtitle">Create an account to get started</p>

        <form id="signupForm">
          <input type="text" id="name" placeholder="Full Name" required>
          <input type="email" id="email" placeholder="Email" required>
          <input type="password" id="password" placeholder="Password" required>
          <button type="submit">Sign Up</button>
        </form>

        <p class="auth_error" id="authError"></p>

        <p class="auth_switch">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>

    <script src="auth.js"></script>
  </body>
</html>
